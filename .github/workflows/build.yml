name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store-track voor de Android-app
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Android-app en website bouwen
        run: ./gradlew :androidApp:assembleDebug :composeApp:wasmJsBrowserDistribution
      - name: APK bewaren
        uses: actions/upload-artifact@v7
        with:
          name: stapje-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Website klaarzetten voor GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Ondertekende release-bundle bouwen en naar Google Play uploaden.
  # Draait alleen als de repository-variabele PLAY_UPLOAD_ENABLED op 'true' staat (zie README),
  # en alleen bij een push naar main of een handmatige run.
  play-store:
    if: >-
      vars.PLAY_UPLOAD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: play-store
    env:
      TRACK: ${{ inputs.track || 'internal' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Keystore klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Ondertekende release-bundle bouwen
        env:
          STAPJE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          STAPJE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STAPJE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STAPJE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :androidApp:bundleRelease
      - name: Release-bundle bewaren
        uses: actions/upload-artifact@v7
        with:
          name: stapje-aab
          path: androidApp/build/outputs/bundle/release/*.aab
      - name: Uploaden naar Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.theeuwesit.stapje
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: ${{ env.TRACK }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Keystore opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
